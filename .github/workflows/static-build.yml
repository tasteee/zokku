name: Static build

on:
  push:
    branches:
      - feature/local-workspace
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static export
        run: npm run build

      - name: Verify export output
        run: test -f out/index.html && test -f out/documents/index.html && test -f out/documents/editor/index.html && test -f out/documents/preview/index.html
